name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ['build/windows-installer']

permissions:
  contents: read

jobs:
  make:
    name: Make Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the native core against Node.js
        run: npm run test:native

      - name: Make Windows distributables
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v4
        with:
          name: flyoff-windows-x64
          path: out/make/**
          if-no-files-found: error
