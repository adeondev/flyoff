name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make:
    name: Make Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Version this build
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Make Windows distributables
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload distributables
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: flyoff-Windows-x64
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find out/make -type f \( -name '*.exe' -o -name '*.zip' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No distributables found under out/make" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="windows-build-${GITHUB_RUN_NUMBER}"
          fi

          release_args=(--title "Flyoff ${tag} - Windows x64")
          release_args+=(--notes "Windows x64 build from commit ${GITHUB_SHA}.")
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" "${release_args[@]}"
          fi
